# Publishes the sample-data demo (docs/demo) to GitHub Pages. Opt-in: set repo variable PAGES_ENABLED=true
# and enable Pages with source "GitHub Actions" (Settings > Pages). Regenerate the page with `npm run build:demo`.
name: Demo Pages

on:
  push:
    branches: [main]
    paths: ["docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@v4

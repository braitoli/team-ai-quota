name: "💡 Feature Request"
description: "Suggest an idea, new AI agent CLI provider, or architecture enhancement"
title: "[Feature]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and suggestions to improve quota tracking, multi-agent capacity planning, and routing!

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - "New Agent Provider Support (e.g. Cline, Roo Code, Windsurf)"
        - "Load Balancer & Smart Routing Strategy"
        - "Server & Storage Backend (SQLite / Postgres / DO)"
        - "Alerting & Notifications (Slack, Telegram, Discord, Email)"
        - "Dashboard UI & Visual Analytics"
        - "Client Daemon & Automation"
        - "Packaging & Deployment (Helm, Kubernetes, Nix)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or bottleneck?
      placeholder: "I'm always frustrated when my team hits the 5h token quota concurrently during sprint deadlines..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "Add support for auto-switching to secondary pooled accounts or notifying via webhook..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?
      placeholder: "Manually checking the dashboard or running a custom bash script..."

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or architectural diagrams about the feature request here.
